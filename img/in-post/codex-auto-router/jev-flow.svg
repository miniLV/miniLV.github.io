<svg xmlns="http://www.w3.org/2000/svg" width="1160" viewBox="0 0 1160 575" role="img" aria-labelledby="flow-title flow-desc" font-family="'Avenir Next','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title id="flow-title">Jev 自动路由的业务流程图</title>
  <desc id="flow-desc">用户发起任务，Codex 产生模型调用，路由器判断是否应直接通过，然后构造允许发送的事实和候选，调用 Jev，校验并应用模型，转发到上游。工具结果触发下一轮；任务结束记录实际结果。</desc>
  <style>
    .svg-head { font-size: 18px; font-weight: 900; fill: #20272a; }
    .svg-sub { font-size: 12px; font-weight: 750; fill: #5e6968; }
    .svg-msg { font-size: 14px; font-weight: 800; fill: #20272a; }
    .svg-small { font-size: 12px; font-weight: 750; fill: #394543; }
    .svg-note { font-size: 13px; font-weight: 850; fill: #24858a; }
  </style>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#20272a"/></marker>
    <marker id="flow-alt" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd557e"/></marker>
  </defs>
  <rect x="20" y="20" width="1120" height="535" rx="22" fill="#fffcf4" stroke="#c9d0c9" stroke-width="2"/>
  <rect x="53" y="58" width="183" height="73" rx="17" fill="#ffe3d1" stroke="#cb6135" stroke-width="3"/>
  <text x="144" y="89" text-anchor="middle" class="svg-head">用户任务</text>
  <text x="144" y="112" text-anchor="middle" class="svg-small">Codex 保持同一会话</text>
  <rect x="299" y="58" width="183" height="73" rx="17" fill="#fff0b9" stroke="#c99e26" stroke-width="3"/>
  <text x="390" y="89" text-anchor="middle" class="svg-head">下一次模型调用</text>
  <text x="390" y="112" text-anchor="middle" class="svg-small">工具结果后重新进入</text>
  <rect x="545" y="58" width="183" height="73" rx="17" fill="#d8f1ef" stroke="#24858a" stroke-width="3"/>
  <text x="636" y="89" text-anchor="middle" class="svg-head">本地准入检查</text>
  <text x="636" y="112" text-anchor="middle" class="svg-small">OFF / 用户固定 / infra</text>
  <path d="M245 95 H289" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <path d="M491 95 H535" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <rect x="792" y="58" width="298" height="73" rx="17" fill="#e1e9ff" stroke="#4268bd" stroke-width="3"/>
  <text x="941" y="89" text-anchor="middle" class="svg-head">确定性直通</text>
  <text x="941" y="112" text-anchor="middle" class="svg-small">用户指定模型 / 固定 infra 组合</text>
  <path d="M737 95 H782" stroke="#bd557e" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#flow-alt)"/>
  <text x="761" y="78" text-anchor="middle" class="svg-small">是</text>
  <path d="M636 141 V169" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <text x="655" y="159" class="svg-small">可路由</text>
  <rect x="543" y="181" width="187" height="76" rx="17" fill="#fff0b9" stroke="#c99e26" stroke-width="3"/>
  <text x="636" y="211" text-anchor="middle" class="svg-head">构造候选与事实</text>
  <text x="636" y="237" text-anchor="middle" class="svg-small">隐私不过 → 固定回退</text>
  <path d="M636 267 V290" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <rect x="543" y="302" width="187" height="76" rx="17" fill="#fbe0e9" stroke="#bd557e" stroke-width="3"/>
  <text x="636" y="333" text-anchor="middle" class="svg-head">Jev 选择组合</text>
  <text x="636" y="358" text-anchor="middle" class="svg-small">一次 Choice + 截止时间</text>
  <path d="M740 340 H782" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <rect x="794" y="302" width="296" height="76" rx="17" fill="#d8f1ef" stroke="#24858a" stroke-width="3"/>
  <text x="942" y="333" text-anchor="middle" class="svg-head">Guard → Apply</text>
  <text x="942" y="357" text-anchor="middle" class="svg-small">无效 / 低置信 → 固定回退</text>
  <path d="M942 388 V412" stroke="#20272a" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <rect x="794" y="424" width="296" height="76" rx="17" fill="#e1e9ff" stroke="#4268bd" stroke-width="3"/>
  <text x="942" y="455" text-anchor="middle" class="svg-head">认证上游执行</text>
  <text x="942" y="479" text-anchor="middle" class="svg-small">SSE 即时返回 · 实际模型可观测</text>
  <path d="M941 141 V292" stroke="#bd557e" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#flow-alt)"/>
  <path d="M784 463 H492" stroke="#24858a" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#flow-arrow)"/>
  <rect x="190" y="424" width="290" height="76" rx="17" fill="#def0dc" stroke="#3e8959" stroke-width="3"/>
  <text x="335" y="455" text-anchor="middle" class="svg-head">Codex 处理响应</text>
  <text x="335" y="479" text-anchor="middle" class="svg-small">要用工具？执行后回到下一调用</text>
  <path d="M335 415 V385 H390 V141" fill="none" stroke="#3e8959" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#flow-arrow)"/>
  <text x="282" y="365" class="svg-small">工具结果 → 下一轮</text>
  <text x="573" y="526" class="svg-small">任务结束：记录实际路由、用量与交付结果；质量验收使用任务产物，不用模型自报。</text>
</svg>
