<svg xmlns="http://www.w3.org/2000/svg" width="1240" viewBox="0 0 1240 676" role="img" aria-labelledby="mod-title mod-desc" font-family="'Avenir Next','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title id="mod-title">Jev Router 的六个模块</title>
  <desc id="mod-desc">六个模块分别负责请求接入、候选与隐私、一次 Jev Choice、校验并应用、认证与流转发、被动观测，接口尽量小，决策、执行与观测分开。</desc>
  <defs>
    <style>
      .mod-id { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 900; letter-spacing: .08em; }
      .mod-title { font-size: 21px; font-weight: 900; fill: #20272a; }
      .mod-desc { font-size: 13.5px; fill: #374440; }
      .mod-contract { font-size: 12.5px; font-weight: 850; fill: #3e4949; }
      .mod-sep { stroke: rgba(32,39,42,.35); stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1200" height="636" rx="22" fill="#fffcf4" stroke="#c9d0c9" stroke-width="2"/>

  <rect x="36" y="48" width="372" height="284" rx="17" fill="#ffe3d1" stroke="#cb6135" stroke-width="3"/>
  <text x="60" y="84" class="mod-id" fill="#cb6135">M1 / INGRESS</text>
  <text x="60" y="116" class="mod-title">请求接入</text>
  <text x="60" y="150" class="mod-desc">接收 Codex Router 转来的</text>
  <text x="60" y="177" class="mod-desc">Responses 请求；识别当前</text>
  <text x="60" y="204" class="mod-desc">会话、调用类型、用户指定</text>
  <text x="60" y="231" class="mod-desc">模型与基础设施调用。保留</text>
  <text x="60" y="258" class="mod-desc">原始请求供转发。</text>
  <line x1="60" y1="280" x2="384" y2="280" class="mod-sep"/>
  <text x="60" y="306" class="mod-contract">输出：CallContext + 原生请求</text>

  <rect x="434" y="48" width="372" height="284" rx="17" fill="#fff0b9" stroke="#c99e26" stroke-width="3"/>
  <text x="458" y="84" class="mod-id" fill="#c99e26">M2 / ADMISSION</text>
  <text x="458" y="116" class="mod-title">候选与隐私</text>
  <text x="458" y="150" class="mod-desc">从已验证可请求的模型清单</text>
  <text x="458" y="177" class="mod-desc">生成候选组合；应用用户</text>
  <text x="458" y="204" class="mod-desc">硬约束；只提取经白名单</text>
  <text x="458" y="231" class="mod-desc">批准、足以决策的路由事实。</text>
  <line x1="458" y1="280" x2="782" y2="280" class="mod-sep"/>
  <text x="458" y="306" class="mod-contract">输出：RoutingFacts + CandidatePairs</text>

  <rect x="832" y="48" width="372" height="284" rx="17" fill="#fbe0e9" stroke="#bd557e" stroke-width="3"/>
  <text x="856" y="84" class="mod-id" fill="#bd557e">M3 / JEV CLIENT</text>
  <text x="856" y="116" class="mod-title">一次 Jev Choice</text>
  <text x="856" y="150" class="mod-desc">用固定版本、固定问题模板</text>
  <text x="856" y="177" class="mod-desc">在候选组合中选择一个。</text>
  <text x="856" y="204" class="mod-desc">只做一次有截止时间的调用；</text>
  <text x="856" y="231" class="mod-desc">返回 pair ID 与置信度。</text>
  <line x1="856" y1="280" x2="1180" y2="280" class="mod-sep"/>
  <text x="856" y="306" class="mod-contract">输出：ProposedPair 或失败原因</text>

  <rect x="36" y="354" width="372" height="284" rx="17" fill="#d8f1ef" stroke="#24858a" stroke-width="3"/>
  <text x="60" y="390" class="mod-id" fill="#24858a">M4 / GUARD + APPLY</text>
  <text x="60" y="422" class="mod-title">校验并应用</text>
  <text x="60" y="456" class="mod-desc">检查候选成员、当前可用性、</text>
  <text x="60" y="483" class="mod-desc">用户约束和置信度。决定</text>
  <text x="60" y="510" class="mod-desc">实际组合后，仅覆盖请求中的</text>
  <text x="60" y="537" class="mod-desc">模型与 effort。</text>
  <line x1="60" y1="586" x2="384" y2="586" class="mod-sep"/>
  <text x="60" y="612" class="mod-contract">输出：AppliedRequest + RouteSource</text>

  <rect x="434" y="354" width="372" height="284" rx="17" fill="#e1e9ff" stroke="#4268bd" stroke-width="3"/>
  <text x="458" y="390" class="mod-id" fill="#4268bd">M5 / RELAY</text>
  <text x="458" y="422" class="mod-title">认证与流转发</text>
  <text x="458" y="456" class="mod-desc">调用已验证的 caller edge；</text>
  <text x="458" y="483" class="mod-desc">响应字节边到边转发；取消</text>
  <text x="458" y="510" class="mod-desc">同步传给上游。开始输出后</text>
  <text x="458" y="537" class="mod-desc">不自动重放。</text>
  <line x1="458" y1="586" x2="782" y2="586" class="mod-sep"/>
  <text x="458" y="612" class="mod-contract">输出：原生 SSE / JSON 响应</text>

  <rect x="832" y="354" width="372" height="284" rx="17" fill="#def0dc" stroke="#3e8959" stroke-width="3"/>
  <text x="856" y="390" class="mod-id" fill="#3e8959">M6 / OBSERVE</text>
  <text x="856" y="422" class="mod-title">被动观测</text>
  <text x="856" y="456" class="mod-desc">记录提议组合、应用组合、</text>
  <text x="856" y="483" class="mod-desc">上游实际模型、耗时、用量与</text>
  <text x="856" y="510" class="mod-desc">失败原因；缺失值标为</text>
  <text x="856" y="537" class="mod-desc">UNKNOWN，不记录原文。</text>
  <line x1="856" y1="586" x2="1180" y2="586" class="mod-sep"/>
  <text x="856" y="612" class="mod-contract">输出：每次调用的审计记录</text>
</svg>
